name: vox_client_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  device_info_plus: ^13.1.0
  google_sign_in: ^7.2.0
  uuid: ^4.5.3
  google_fonts: ^8.2.1
  flutter_local_notifications: ^22.0.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  record: ^7.1.1
  path_provider: ^2.1.5
  web_socket_channel: ^3.0.3
  flutter_tts: ^4.2.3
  firebase_app_installations: ^0.4.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon-512.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - .env
